<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Expense Tracker</h1>
    
    <!-- Warning Message UI Element -->
    <div id="warning-message" class="warning-banner hidden"></div>

    <!-- Expense Form (Handles Add & Update) -->
    <div class="form-container">
        <h2 id="form-title">Add New Expense</h2>
        <form id="expense-form">
            <input type="hidden" id="expense-id">
            
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" placeholder="e.g., Lunch, Bus fare" required>
            </div>
            
            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" step="0.01" placeholder="0.00" required>
            </div>
            
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="" disabled selected>Select a category</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <button type="submit" id="btn-submit-text" class="btn-submit">Add Expense</button>
            <button type="button" id="btn-cancel" class="btn-cancel hidden">Cancel Edit</button>
        </form>
    </div>

    <!-- Expenses Table Display -->
    <h2>All Expenses</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Description</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="expenses-table-body">
            <!-- Dynamic Content injected via JavaScript -->
        </tbody>
    </table>

    <script src="app.js"></script>
</body>
</html>
